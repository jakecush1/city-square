<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>City Square — pick a door</title>
  <meta name="description" content="A rainy-night street in Three.js. Walk into The Garrison Tavern (Gilded Minstrels) or up to the music apartment (Room 808 bedroom studio)." />
  <meta name="theme-color" content="#0b0f15" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f15'/%3E%3Crect x='15' y='12' width='2' height='14' fill='%23556'/%3E%3Ccircle cx='16' cy='10' r='4.5' fill='%23ffb15c'/%3E%3Ccircle cx='16' cy='10' r='7' fill='%23ffb15c' opacity='.25'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="hud-brand">
      <span class="hud-brand-name">CITY SQUARE</span>
      <span class="hud-brand-sub">old town · <span id="clock">11:48 PM</span> · rain</span>
    </div>
  </header>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite">
    <span class="tooltip-name" id="tooltip-name"></span>
    <span class="tooltip-blurb" id="tooltip-blurb"></span>
    <span class="tooltip-cta">click to go inside</span>
  </div>

  <nav class="doors" id="doors" aria-label="Places to go">
    <button class="door" data-dest="tavern" type="button">
      <span class="door-kicker">left · the tavern</span>
      <span class="door-name">The Garrison Tavern</span>
      <span class="door-blurb">Gilded Minstrels · a candlelit band tavern</span>
    </button>
    <button class="door" data-dest="studio" type="button">
      <span class="door-kicker">right · the apartment</span>
      <span class="door-name">音楽アパート · Room 808</span>
      <span class="door-blurb">Bedroom Studio · lofi machines after midnight</span>
    </button>
  </nav>
  <div class="hint" id="hint">Click a building to go inside · drag to look around</div>

  <div class="toast" id="toast" role="alert" hidden></div>
  <div class="fade" id="fade"></div>

  <section class="portal" id="portal" hidden aria-label="Inside">
    <div class="portal-bar">
      <button class="portal-back" id="portal-back" type="button">← Back to the street</button>
      <span class="portal-title" id="portal-title"></span>
      <a class="portal-open" id="portal-open" href="#" target="_blank" rel="noopener">Open in its own tab ↗</a>
    </div>
    <iframe class="portal-frame" id="portal-frame" title="Inside" src="about:blank"
      allow="autoplay; fullscreen; microphone; midi; gamepad; xr-spatial-tracking; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
